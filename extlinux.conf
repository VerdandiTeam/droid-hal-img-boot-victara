default sailfish

label sailfish
    linux /sailfish/zImage
    fdt /sailfish/qcom-msm8974pro-motorola-victara.dtb
    initrd /sailfish/initrd.img
    append console=tty0 systemd.show_status=false loglevel=1 vt.global_cursor_default=0 msm.allow_vram_carveout=1 msm.vram=128m mem_sleep_default=s2idle
